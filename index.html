<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="检测你的电脑硬件配置，看看能运行哪些 Ollama AI 模型 — Detect your hardware and see which AI models you can run locally">
  <meta name="theme-color" content="#0f1117">
  <title>本地 AI 模型兼容性检测 — Local AI Checker</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Preload logo/icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">

  <!--
    JavaScript Modules — loaded in dependency order:
    1. i18n.js      Translation strings
    2. gpu-db.js    GPU model → VRAM database
    3. models-db.js AI model database
    4. hardware.js  Hardware detection (depends on i18n, gpu-db)
    5. matcher.js   Compatibility matching (depends on models-db)
    6. ui.js        UI rendering (depends on i18n, matcher)
    7. app.js       Bootstrap (depends on all)
  -->
  <script src="js/i18n.js"></script>
  <script src="js/gpu-db.js"></script>
  <script src="js/models-db.js"></script>
  <script src="js/hardware.js"></script>
  <script src="js/matcher.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <!-- Single app container, everything rendered by UI module -->
  <div id="app">
    <noscript>
      <div style="padding: 40px; text-align: center; color: #ff5c5c; background: #0f1117; min-height: 100vh; font-family: sans-serif;">
        <h1>⚠️ JavaScript Required / 需要启用 JavaScript</h1>
        <p>This tool requires JavaScript to detect your hardware and render model recommendations.</p>
        <p>本工具需要 JavaScript 来检测硬件配置并显示模型推荐。</p>
        <p style="margin-top: 20px; color: #8b8fa3;">请在浏览器设置中启用 JavaScript 后刷新页面。</p>
      </div>
    </noscript>
  </div>
</body>
</html>
